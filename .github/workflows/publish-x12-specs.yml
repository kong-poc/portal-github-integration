name: Publish X12 specs to Kong Konnect Catalog

# Secrets needed in this repo (Settings > Secrets and variables > Actions):
#   KONNECT_TOKEN      - Konnect Personal Access Token
#   KONNECT_PORTAL_ID  - target Dev Portal ID
#
# Auto-discovers every specs/*.md file - no workflow edits needed to add a new spec.
# Each file must start with YAML front matter, e.g.:
#   ---
#   api_name: "X12 850 - Purchase Order"
#   category: "Order Management"
#   ---
# The API name and category come from front matter; the Document slug is derived from the
# filename (e.g. specs/x12-850-purchase-order.md -> slug x12-850-purchase-order).
#
# For each discovered file, this workflow:
#   1. Looks up an existing Catalog API by name (GET /v3/apis?filter[name][eq]=...)
#   2. Creates it if missing (POST /v3/apis) - no OpenAPI spec/version, doc-only API
#   3. Sets/updates the "category" and "last_updated" attributes (PATCH /v3/apis/{id}) -
#      category drives Portal filtering; last_updated (auto-derived from each file's last
#      git commit date, YYYY-MM-DD) can be shown on the Portal card via card-attribute-keys
#   4. Upserts the markdown (front matter stripped) as an API Document, plus a "## Downloads"
#      section (raw .md link, raw .txt illustrative-sample link, .zip bundle link) - ONLY when
#      the repo is currently public (see the is-public check in the discover job). Files served
#      via raw.githubusercontent.com / GitHub Releases 404 for anonymous visitors on a private
#      repo, so the section is omitted entirely rather than shipping dead links. This auto
#      section is skipped for specs in CUSTOM_DOWNLOADS_SLUGS (see below) that hand-author their
#      own Downloads section instead, to test an alternate file-hosting mechanism.
#   5. Publishes/ensures published to the portal (PUT /v3/apis/{id}/publications/{portalId})
#
# Category taxonomy (matches internal Expeditors standard spec categories):
#   Accounting, Customs, Distribution, Transportation, ISF, Order Management,
#   Delivery Management, Other
#
# Optional front-matter attributes (both merged into the API's `attributes` only when present,
# and both worth adding to the Portal Editor's card-attribute-keys to show on the card):
#   mode          - Transportation specs only, comma-separated (e.g. "Air, Truck")
#   hosting_test  - flags a spec as an alternate-file-hosting POC (e.g. "GitHub Pages",
#                   "External Storage (Google Drive)"). Currently set on:
#                     x12-850-purchase-order - GitHub Pages hosting test
#                     x12-810-invoice        - External storage (personal Google Drive) test
#                   These two specs are also excluded from the auto Release-based Downloads
#                   section (see CUSTOM_DOWNLOADS_SLUGS in the publish step) since they carry
#                   their own hand-authored Downloads section in the source .md instead.
#
# Option A downloads (public-only): the build-downloads job extracts each spec's illustrative
# EDI example into specs/samples/<slug>-sample.txt (committed back to main), zips it with the
# source .md into dist/<slug>.zip, and uploads all zips to one persistent Release
# (tag: specs-downloads, recreated/updated every run).

on:
  workflow_dispatch: {}
  public: {} # Auto-runs the moment this repo is flipped from private to public (GitHub-native
             # event). There is no symmetric "made private" event, so reverting to private still
             # requires a manual "Run workflow" click to regenerate Documents without the
             # Downloads section.
  push:
    branches: [main]
    paths:
      - 'specs/**' # Auto-publish on any spec content/attachment change - no manual "Run
                   # workflow" click needed. Safe from self-triggering loops: the
                   # build-downloads job's own commit back to main includes "[skip ci]".

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      is-public: ${{ steps.check-visibility.outputs.is-public }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed to derive each file's last commit date

      - name: Check repository visibility
        id: check-visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VISIBILITY=$(gh repo view "${{ github.repository }}" --json visibility -q .visibility)
          echo "Repository visibility: $VISIBILITY"
          if [ "$VISIBILITY" = "PUBLIC" ]; then
            echo "is-public=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-public=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build matrix from specs/*.md front matter
        id: build-matrix
        run: |
          set -e
          ENTRIES="[]"
          for f in specs/*.md; do
            [ -e "$f" ] || continue
            NAME=$(sed -n 's/^api_name:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$f" | head -n1)
            CATEGORY=$(sed -n 's/^category:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$f" | head -n1)
            MODE=$(sed -n 's/^mode:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$f" | head -n1)
            HOSTING_TEST=$(sed -n 's/^hosting_test:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$f" | head -n1)
            SLUG=$(basename "$f" .md)

            # Last commit date that touched this file (YYYY-MM-DD); falls back to today
            # if the file is new/uncommitted in this checkout.
            LAST_UPDATED=$(git log -1 --format=%cs -- "$f")
            [ -z "$LAST_UPDATED" ] && LAST_UPDATED=$(date -u +%Y-%m-%d)

            if [ -z "$NAME" ]; then
              echo "::error file=$f::Missing api_name in front matter - skipping this file"
              continue
            fi

            ENTRY=$(jq -n --arg file "$f" --arg api_name "$NAME" --arg category "$CATEGORY" \
              --arg doc_slug "$SLUG" --arg last_updated "$LAST_UPDATED" --arg mode "$MODE" \
              --arg hosting_test "$HOSTING_TEST" \
              '{file: $file, api_name: $api_name, category: $category, doc_slug: $doc_slug, last_updated: $last_updated, mode: $mode, hosting_test: $hosting_test}')
            ENTRIES=$(echo "$ENTRIES" | jq --argjson entry "$ENTRY" '. + [$entry]')
          done

          echo "Discovered specs:"
          echo "$ENTRIES" | jq -r '.[] | "- \(.file) -> \(.api_name) [\(.category)] (updated \(.last_updated))"'

          MATRIX=$(echo "$ENTRIES" | jq -c '{include: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-downloads:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract illustrative samples + build per-spec zip bundles
        run: |
          set -e
          mkdir -p specs/samples dist
          for f in specs/*.md; do
            [ -e "$f" ] || continue
            SLUG=$(basename "$f" .md)
            SAMPLE="specs/samples/${SLUG}-sample.txt"

            # Pull the fenced code block under "## Illustrative example" into its own .txt file.
            # \r? tolerance matches the same CRLF gotcha handled by the front-matter stripper.
            awk '
              BEGIN { insection=0; incode=0 }
              /^## Illustrative example/ { insection=1; next }
              insection && /^```\r?$/ {
                if (incode) { exit }
                incode=1; next
              }
              incode { print }
            ' "$f" | sed 's/\r$//' > "$SAMPLE"

            if [ ! -s "$SAMPLE" ]; then
              echo "::warning file=$f::No illustrative example block found - skipping sample/zip"
              rm -f "$SAMPLE"
              continue
            fi

            # Optional manually-authored attachments (not auto-generated): drop a file at
            # specs/attachments/<slug>.pdf and/or specs/attachments/<slug>.docx and it's picked
            # up automatically - no workflow edit needed, same "just add a file" spirit as specs/.
            ATTACH_ARGS=()
            for ext in pdf docx; do
              ATT="specs/attachments/${SLUG}.${ext}"
              [ -f "$ATT" ] && ATTACH_ARGS+=("$ATT")
            done

            zip -j "dist/${SLUG}.zip" "$f" "$SAMPLE" "${ATTACH_ARGS[@]}"
          done

      - name: Commit generated sample files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add specs/samples
          git diff --cached --quiet || git commit -m "chore: auto-generate illustrative sample .txt files [skip ci]"
          git push

      - name: Create or update the shared downloads release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if ! gh release view specs-downloads --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create specs-downloads --repo "${{ github.repository }}" \
              --title "X12 Spec Downloads (auto-generated)" \
              --notes "Per-spec .md + .txt (+ optional .pdf/.docx) bundles, rebuilt by CI. Do not edit assets manually."
          fi
          # Upload the individual .md, .txt sample, and any .pdf/.docx attachments too (not just
          # the .zip) - GitHub Release assets always get Content-Disposition: attachment, forcing
          # a real download even for text/PDF files. raw.githubusercontent.com (and Chrome's
          # built-in PDF viewer) render these inline instead, which is why links to them open in
          # a new tab rather than downloading.
          for f in specs/*.md; do
            [ -e "$f" ] || continue
            gh release upload specs-downloads "$f" --repo "${{ github.repository }}" --clobber
          done
          for s in specs/samples/*.txt; do
            [ -e "$s" ] || continue
            gh release upload specs-downloads "$s" --repo "${{ github.repository }}" --clobber
          done
          for a in specs/attachments/*.pdf specs/attachments/*.docx; do
            [ -e "$a" ] || continue
            gh release upload specs-downloads "$a" --repo "${{ github.repository }}" --clobber
          done
          for z in dist/*.zip; do
            [ -e "$z" ] || continue
            gh release upload specs-downloads "$z" --repo "${{ github.repository }}" --clobber
          done

  publish-x12-specs:
    needs: [discover, build-downloads]
    runs-on: ubuntu-latest
    env:
      KONNECT_BASE_URL: https://us.api.konghq.com
      KONNECT_PORTAL_ID: ${{ secrets.KONNECT_PORTAL_ID }}
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
      IS_PUBLIC: ${{ needs.discover.outputs.is-public }}
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish ${{ matrix.api_name }}
        run: |
          set -e
          API_NAME="${{ matrix.api_name }}"
          DOC_SLUG="${{ matrix.doc_slug }}"
          FILE="${{ matrix.file }}"
          CATEGORY="${{ matrix.category }}"
          LAST_UPDATED="${{ matrix.last_updated }}"
          MODE="${{ matrix.mode }}"
          HOSTING_TEST="${{ matrix.hosting_test }}"

          # Strip the YAML front matter (first --- ... --- block) before publishing as Document content.
          # Patterns tolerate an optional trailing \r since specs/*.md may have CRLF line endings.
          CONTENT_RAW=$(awk '
            NR==1 && /^---\r?$/ { infm=1; next }
            infm && /^---\r?$/ { infm=0; next }
            infm { next }
            { print }
          ' "$FILE")

          # Only append a Downloads section while the repo is public - Release asset links 404
          # for anonymous visitors on a private repo, so we omit the section entirely rather
          # than ship dead links (see is-public check in discover job).
          # Some specs are alternate-hosting test cases with their own hand-authored Downloads
          # section already in the source .md, so the auto Release-based section is skipped for
          # them to keep each hosting approach visually distinct on the Portal:
          #   x12-850-purchase-order - GitHub Pages hosting test
          #   x12-810-invoice        - External storage (personal Google Drive) hosting test
          CUSTOM_DOWNLOADS_SLUGS=("x12-850-purchase-order" "x12-810-invoice")
          SKIP_AUTO_DOWNLOADS=false
          for s in "${CUSTOM_DOWNLOADS_SLUGS[@]}"; do
            [ "$DOC_SLUG" = "$s" ] && SKIP_AUTO_DOWNLOADS=true
          done

          if [ "$IS_PUBLIC" = "true" ] && [ "$SKIP_AUTO_DOWNLOADS" = "false" ]; then
            RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/specs-downloads"
            DOWNLOADS_MD=$'\n## Downloads\n\n'
            DOWNLOADS_MD+="- [Download spec (.md)](${RELEASE_BASE}/$(basename "$FILE"))"$'\n'
            DOWNLOADS_MD+="- [Download illustrative sample (.txt)](${RELEASE_BASE}/${DOC_SLUG}-sample.txt)"$'\n'
            if [ -f "specs/attachments/${DOC_SLUG}.pdf" ]; then
              DOWNLOADS_MD+="- [Download spec (.pdf)](${RELEASE_BASE}/${DOC_SLUG}.pdf)"$'\n'
            fi
            if [ -f "specs/attachments/${DOC_SLUG}.docx" ]; then
              DOWNLOADS_MD+="- [Download configuration worksheet (.docx)](${RELEASE_BASE}/${DOC_SLUG}.docx)"$'\n'
            fi
            DOWNLOADS_MD+="- [Download all files (.zip)](${RELEASE_BASE}/${DOC_SLUG}.zip)"$'\n'
            CONTENT_RAW="${CONTENT_RAW}${DOWNLOADS_MD}"
            echo "Repo is public - Downloads section added"
          elif [ "$SKIP_AUTO_DOWNLOADS" = "true" ]; then
            echo "Skipping auto Downloads section - $DOC_SLUG carries its own hand-authored Downloads section"
          else
            echo "Repo is private - skipping Downloads section (links would 404 for portal visitors)"
          fi

          CONTENT=$(printf '%s' "$CONTENT_RAW" | jq -Rs .)

          # Base attributes every spec gets; mode and hosting_test are optional add-ons merged in
          # below only when present in the front matter, so specs without them are unaffected.
          ATTRS_JSON=$(jq -n --arg cat "$CATEGORY" --arg upd "$LAST_UPDATED" '{category: [$cat], last_updated: [$upd]}')

          # mode may be a comma-separated list (e.g. "Air, Truck") -> JSON array ["Air","Truck"].
          if [ -n "$MODE" ]; then
            MODE_ARR=$(echo "$MODE" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";""))')
            ATTRS_JSON=$(echo "$ATTRS_JSON" | jq --argjson mode "$MODE_ARR" '. + {mode: $mode}')
          fi

          # hosting_test flags a spec as an alternate-file-hosting POC (e.g. "GitHub Pages",
          # "External Storage (Google Drive)") - shown on the Portal card via card-attribute-keys.
          if [ -n "$HOSTING_TEST" ]; then
            ATTRS_JSON=$(echo "$ATTRS_JSON" | jq --arg ht "$HOSTING_TEST" '. + {hosting_test: [$ht]}')
          fi

          echo "Looking up API named '$API_NAME'..."
          EXISTING_API=$(curl -sS -G "$KONNECT_BASE_URL/v3/apis" \
            -H "Authorization: Bearer $KONNECT_TOKEN" \
            --data-urlencode "filter[name][eq]=$API_NAME")
          API_ID=$(echo "$EXISTING_API" | jq -r '.data[0].id // empty')

          if [ -z "$API_ID" ]; then
            echo "No existing API found - creating it with category=$CATEGORY, last_updated=$LAST_UPDATED"
            CREATED_API=$(curl -sS -X POST "$KONNECT_BASE_URL/v3/apis" \
              -H "Authorization: Bearer $KONNECT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg name "$API_NAME" --argjson attrs "$ATTRS_JSON" '{name: $name, attributes: $attrs}')")
            API_ID=$(echo "$CREATED_API" | jq -r '.id')
            echo "Created API id=$API_ID"
          else
            echo "Found existing API id=$API_ID - updating category/last_updated attributes"
            curl -sS -X PATCH "$KONNECT_BASE_URL/v3/apis/$API_ID" \
              -H "Authorization: Bearer $KONNECT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --argjson attrs "$ATTRS_JSON" '{attributes: $attrs}')"
          fi

          echo "Looking up existing document with slug=$DOC_SLUG..."
          EXISTING_DOC=$(curl -sS -G "$KONNECT_BASE_URL/v3/apis/$API_ID/documents" \
            -H "Authorization: Bearer $KONNECT_TOKEN" \
            --data-urlencode "filter[slug][eq]=$DOC_SLUG")
          DOC_ID=$(echo "$EXISTING_DOC" | jq -r '.data[0].id // empty')

          if [ -n "$DOC_ID" ]; then
            echo "Existing document found (id=$DOC_ID) - updating with PATCH"
            curl -sS -X PATCH "$KONNECT_BASE_URL/v3/apis/$API_ID/documents/$DOC_ID" \
              -H "Authorization: Bearer $KONNECT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"status\": \"published\",
                \"content\": $CONTENT
              }"
          else
            echo "No existing document found - creating with POST"
            curl -sS -X POST "$KONNECT_BASE_URL/v3/apis/$API_ID/documents" \
              -H "Authorization: Bearer $KONNECT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"slug\": \"$DOC_SLUG\",
                \"title\": \"$API_NAME\",
                \"status\": \"published\",
                \"content\": $CONTENT
              }"
          fi

          echo "Publishing API to portal $KONNECT_PORTAL_ID..."
          curl -sS -X PUT "$KONNECT_BASE_URL/v3/apis/$API_ID/publications/$KONNECT_PORTAL_ID" \
            -H "Authorization: Bearer $KONNECT_TOKEN"

          echo "Done: $API_NAME"
